[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cagsyntax"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["pydicom>=2.4", "numpy", "PySide6", "pylibjpeg", "pylibjpeg-libjpeg", "pillow", "onnxruntime", "pydantic>=2.5"]

[project.optional-dependencies]
test = ["pytest", "onnx"]   # onnx builds the tiny models used by the AI tests

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.package-data]
"cagsyntax.ui" = ["assets/*"]
