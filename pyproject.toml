[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cagsyntax"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydicom>=2.4", "numpy", "PySide6", "pylibjpeg", "pylibjpeg-libjpeg"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
